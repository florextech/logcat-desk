name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  macos-release:
    name: Build macOS Release
    runs-on: macos-latest
    environment: production
    env:
      HAS_MACOS_SIGNING: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate codebase
        run: |
          npm run lint
          npm run test:coverage

      - name: Build signed and notarized release artifacts
        if: env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Staple notarized artifacts
        if: env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARIZATION == 'true'
        run: |
          shopt -s nullglob
          for file in release/*.dmg; do
            xcrun stapler staple "$file"
          done

      - name: Build unsigned fallback artifacts
        if: env.HAS_MACOS_SIGNING != 'true' || env.HAS_MACOS_NOTARIZATION != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          echo "macOS signing or notarization secrets are missing. Building unsigned artifacts."
          npm run dist:mac

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: logcat-desk-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          generate_release_notes: true
